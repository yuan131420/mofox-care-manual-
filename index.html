<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>墨狐飼養手冊｜MoFox Care Manual</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       Intro / Initializing
  ========================== -->

  <main class="intro page">

    <div class="intro-card">

      <div class="system-label">
        MoFox Research Database
      </div>

      <div class="terminal-line">
        Initializing...
      </div>

      <div class="terminal-line">
        Searching database...
      </div>

      <div class="terminal-line">
        Unknown lifeform detected.
      </div>

      <div class="terminal-line">
        Specimen identified.
      </div>


      <section class="specimen-found">

        <div class="specimen-number">
          Specimen No. 0914
        </div>

        <h1>MoFox</h1>

        <div>
          墨狐
        </div>

      </section>


      <div class="warning">

        ⚠️ <strong>Highly autonomous lifeform detected.</strong>

        <br>

        不建議擅自嘗試馴服。

      </div>


      <div class="button-group">

        <button class="btn btn-primary">
          閱讀飼養指南
        </button>

        <button class="btn btn-secondary"id="pet-fox">
          我很勇，我直接摸
        </button>

      </div>


      <div class="fox-response">
        <!-- 之後狐狸會在這裡說話 -->
      </div>

    </div>

  </main>
  <script src="script.js"></script>
</body>

</html>
